<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestão de Recursos | PMSBC</title><style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#1d3346;background:#f2f6fa}*{box-sizing:border-box}body{margin:0}header{background:#075082;color:white;padding:19px 28px;display:flex;justify-content:space-between;align-items:center}header small{display:block;color:#cce3f1;margin-top:5px}.shell{display:flex;min-height:calc(100vh - 74px)}nav{background:#103d61;width:220px;flex-shrink:0;padding:22px 12px}nav button{display:block;width:100%;background:transparent;color:#d8eaf7;border:0;text-align:left;padding:13px;border-radius:9px;cursor:pointer;font-size:14px}nav button.active,nav button:hover{background:#2873a4;color:white}main{flex:1;min-width:0;padding:28px;max-width:1500px}h1{margin:0 0 8px;font-size:25px}h2{font-size:17px;margin:0 0 18px;color:#134a73}.sub{color:#617487;font-size:13px;margin:0 0 22px}.card{background:white;border:1px solid #dce5ed;border-radius:12px;padding:21px;margin-bottom:16px;box-shadow:0 1px 3px #173d6010}.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.three .card{margin:0}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.field label{display:block;font-size:12px;color:#657789;margin-bottom:5px}.field strong{font-size:14px;font-weight:600;overflow-wrap:anywhere}.stack{display:grid;gap:16px}.tag{display:inline-block;background:#e7f2f9;color:#075082;border-radius:30px;padding:5px 10px;font-size:12px;margin:3px 5px 3px 0}.status{background:#e5f3e8;color:#206638}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}input,select{background:white;border:1px solid #cbd9e5;border-radius:8px;padding:11px;color:#203c50;min-width:160px;flex:1}button{cursor:pointer}.primary{background:#075082;color:white;border:0;border-radius:8px;padding:11px 16px}.outline{background:white;color:#075082;border:1px solid #9ab7ca;border-radius:8px;padding:10px 14px}.list{display:grid;gap:9px}.item{width:100%;text-align:left;background:white;border:1px solid #dce5ed;border-radius:10px;padding:17px;cursor:pointer;color:#183d5a}.item:hover{border-color:#1975a7;background:#f5fbff}.item b{display:block;margin:7px 0}.item small{color:#657789}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.note{background:#eef6fb;border-left:3px solid #2786b5;padding:13px;font-size:13px;border-radius:5px;margin-top:16px}.money{font-size:17px;color:#075082;font-weight:700}.tabs{display:flex;gap:7px;margin:16px 0}.hidden{display:none!important}.empty{color:#657789;padding:25px;text-align:center}@media(max-width:1000px){.three{grid-template-columns:1fr}.fields{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.shell{display:block}nav{width:100%;display:flex;overflow:auto;padding:8px}nav button{min-width:max-content}main{padding:15px}.fields{grid-template-columns:1fr}header{padding:15px}.toolbar{display:grid}h1{font-size:21px}}</style></head><body><header><div><b>Gestão de Recursos Municipais</b><small>Prefeitura de São Bernardo do Campo · Protótipo demonstrativo</small></div><span>SBGOV</span></header><div class="shell"><nav id="nav"><button data-view="recursos" class="active">▦ Recursos</button><button data-view="analise">◷ Em Análise</button><button data-view="cadastro">▤ Em Cadastramento</button><button data-view="formalizacao">▣ Em Formalização</button><button data-view="execucao">◉ Execução</button></nav><main id="app"></main></div><script>
const statuses=['Em Análise','Em Cadastramento','Em Formalização','Aguardando Execução','Execução Administrativa','Execução','Prestação de Contas Final'];
const dados=[
{id:'RG-001',nome:'Construção de Unidade Básica de Saúde',plataforma:'Transferegov',esfera:'Federal',tipo:'Emenda',fluxo:'Beneficiário de Emenda',status:3,programa:'5500020260001',proposta:'123456/2026',registro:'123456',registroLabel:'Instrumento da plataforma',formal:'Convênio 123456/2026',modalidade:'Convênio',orgao:'Ministério da Saúde',autor:'Identificação pendente',emenda:'202640010001',origem:'Individual',indicacao:'Não se aplica',repasse:1200000,contrapartida:100000,liberado:500000,executado:150000},
{id:'RG-002',nome:'Equipamentos hospitalares',plataforma:'FNS/InvestSUS',esfera:'Federal',tipo:'Emenda',fluxo:'Beneficiário de Emenda',status:4,proposta:'36000999999202600',formal:null,modalidade:'Fundo a Fundo',orgao:'Ministério da Saúde',autor:'Identificação pendente',emenda:'202650120003',origem:'Comissão',indicacao:'Identificação pendente',repasse:850000,contrapartida:0,liberado:850000,executado:0},
{id:'RG-003',nome:'Reforma de equipamento esportivo',plataforma:'SP Sem Papel',esfera:'Estadual',tipo:'Emenda',fluxo:'Beneficiário de Emenda',status:5,registro:'00AB12',registroLabel:'Demanda estadual',formal:'Convênio 2026-00456',modalidade:'Convênio',orgao:'Secretaria Estadual de Esportes',autor:'Identificação pendente',emenda:'2026-001234',origem:'Individual',indicacao:'Não se aplica',solicitante:'Outro solicitante',repasse:500000,contrapartida:25000,liberado:500000,executado:80000},
{id:'RG-004',nome:'Modernização da infraestrutura urbana',plataforma:'Transferegov',esfera:'Federal',tipo:'Programa',fluxo:'Proposta Voluntária',status:6,programa:'5500020260044',proposta:'654321/2026',registro:'998877',registroLabel:'Instrumento da plataforma',formal:'Contrato de Repasse 998877/2026',modalidade:'Contrato de Repasse',orgao:'Ministério das Cidades',repasse:3500000,contrapartida:350000,liberado:2100000,executado:1350000},
{id:'RG-005',nome:'Programação de assistência social',plataforma:'FNAS/EstruturaSUAS',esfera:'Federal',tipo:'Emenda',fluxo:'Beneficiário de Emenda',status:6,proposta:'PROG-2026-0456',formal:null,modalidade:'Fundo a Fundo',orgao:'Ministério do Desenvolvimento e Assistência Social',autor:'Identificação pendente',emenda:'2026-EX-005',origem:'Individual',indicacao:'Não se aplica',repasse:320000,contrapartida:0,liberado:320000,executado:180000},
{id:'RG-006',nome:'Aquisição de veículos',plataforma:'SP Sem Papel',esfera:'Estadual',tipo:'Programa',fluxo:'Proposta Voluntária',status:2,registro:'00CD34',registroLabel:'Demanda estadual',formal:null,modalidade:'Convênio',orgao:'Secretaria Estadual da Saúde',solicitante:'Prefeito',repasse:420000,contrapartida:20000,liberado:0,executado:0},
{id:'RG-007',nome:'Infraestrutura — transferência especial',plataforma:'Transferegov',esfera:'Federal',tipo:'Emenda',fluxo:'Beneficiário de Emenda',status:5,formal:null,modalidade:'Especial',orgao:'Órgão federal — identificação pendente',autor:'Identificação pendente',emenda:'202640010099',origem:'Individual',indicacao:'Não se aplica',repasse:700000,contrapartida:0,liberado:700000,executado:120000},
{id:'RG-008',nome:'Programa estadual de infraestrutura',plataforma:'SP Sem Papel',esfera:'Estadual',tipo:'Programa',fluxo:'Proponente Específico',status:1,registro:'00EF56',registroLabel:'Demanda estadual',formal:null,modalidade:'Convênio',orgao:'Secretaria Estadual responsável',solicitante:'Outro solicitante',repasse:900000,contrapartida:45000,liberado:0,executado:0},
{id:'RG-009',nome:'Emenda estadual em cadastramento',plataforma:'SP Sem Papel',esfera:'Estadual',tipo:'Emenda',fluxo:'Beneficiário de Emenda',status:2,registro:'00GH78',registroLabel:'Demanda estadual',formal:null,modalidade:'Convênio',orgao:'Secretaria Estadual responsável',solicitante:'Prefeito',autor:'Identificação pendente',emenda:'2026-EX-009',origem:'Individual',indicacao:'Não se aplica',repasse:250000,contrapartida:10000,liberado:0,executado:0}
];
const app=document.getElementById('app');let view='recursos',selected=dados[0],tab='analise';
const esc=x=>String(x??'—').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=x=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(x||0);
const field=(l,v)=>'<div class="field"><label>'+esc(l)+'</label><strong>'+esc(v??'Não informado')+'</strong></div>';
const card=(title,body)=>'<section class="card"><h2>'+title+'</h2>'+body+'</section>';
const list=items=>'<div class="list">'+(items.length?items.map(x=>'<button class="item" data-open="'+x.id+'"><div class="row"><small>'+x.id+' · '+esc(x.plataforma)+'</small><small>'+esc(statuses[x.status-1])+'</small></div><b>'+esc(x.nome)+'</b><span class="tag">'+esc(x.tipo)+'</span><span class="tag">'+esc(x.fluxo)+'</span><small>'+brl(x.repasse)+'</small></button>').join(''):'<div class="empty">Nenhum registro encontrado.</div>')+'</div>';
function render(){
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
if(view==='recursos'){app.innerHTML='<h1>Recursos</h1><p class="sub">Consulta consolidada de recursos federais e estaduais</p><div class="toolbar"><input id="q" placeholder="Pesquisar recurso, órgão ou identificação"><select id="pl"><option value="">Todas as plataformas</option>'+[...new Set(dados.map(x=>x.plataforma))].map(x=>'<option>'+esc(x)+'</option>').join('')+'</select><select id="tipo"><option value="">Todos os tipos</option><option>Emenda</option><option>Programa</option></select><select id="st"><option value="">Todos os status</option>'+statuses.map((s,i)=>'<option value="'+(i+1)+'">'+(i+1)+' — '+s+'</option>').join('')+'</select></div><div id="results"></div>';['q','pl','tipo','st'].forEach(id=>document.getElementById(id).addEventListener('input',filter));filter();return}
if(view==='detalhe'){let x=selected;let ident=[field('Esfera',x.esfera),field('Plataforma',x.plataforma),...(x.programa?[field('Nº Programa',x.programa)]:[]),...(x.proposta?[field(x.plataforma.startsWith('FNAS')?'Nº Programação':'Nº Proposta',x.proposta)]:[]),...(x.registro?[field(x.registroLabel||'Identificador',x.registro)]:[])].join('');if(x.plataforma==='SP Sem Papel'){ident+='<div class="note"><b>Explicação da classificação automática</b><p>Demanda de '+x.tipo.toLowerCase()+' iniciada '+(x.solicitante==='Prefeito'?'pelo prefeito':'por outro solicitante')+'.</p>'+(x.tipo==='Emenda'?'A origem parlamentar determina o fluxo, independentemente do solicitante.':'Classificação municipal operacional: '+esc(x.fluxo)+'.')+'</div>'}
app.innerHTML='<button class="outline" id="back">← Voltar aos recursos</button><h1 style="margin-top:20px">'+esc(x.nome)+'</h1><p class="sub"><span class="tag">'+x.id+'</span><span class="tag">'+esc(x.esfera)+'</span><span class="tag status">'+esc(statuses[x.status-1])+'</span></p>'+card('Identificação Governamental','<div class="fields">'+ident+'</div>')+'<div class="three">'+card('Classificação do Recurso','<div class="stack">'+field('Tipo',x.tipo)+field('Fluxo',x.fluxo)+field('Órgão responsável',x.orgao)+'</div>')+card('Repasse e Formalização','<div class="stack">'+field('Modalidade de repasse',x.modalidade)+field('Nº Instrumento Formalizador',x.formal||(x.modalidade==='Especial'||x.modalidade==='Fundo a Fundo'?'Não se aplica':'Aguardando formalização'))+'</div>')+card('Valores','<div class="stack">'+field('Valor do repasse',brl(x.repasse))+field('Contrapartida',brl(x.contrapartida))+field('Valor total previsto',brl(x.repasse+x.contrapartida))+field('Valor liberado',brl(x.liberado))+field('Valor executado',brl(x.executado))+'</div>')+'</div>'+(x.tipo==='Emenda'?card('Emenda Parlamentar','<div class="fields">'+field('Nº Emenda',x.emenda)+field('Origem',x.origem)+field('Autoria',x.autor)+field('Indicação',x.indicacao)+'</div>'):'')+'<p class="sub">Dados fictícios para validação do protótipo. Informações financeiras não representam repasses reais.</p>';document.getElementById('back').onclick=()=>navigate('recursos');return}
if(view==='analise'){app.innerHTML='<h1>Status 1 — Em Análise</h1><p class="sub">Visão operacional de oportunidades e recursos sob avaliação municipal</p><div class="tabs"><button class="'+(tab==='disponiveis'?'primary':'outline')+'" data-tab="disponiveis">Disponíveis</button><button class="'+(tab==='analise'?'primary':'outline')+'" data-tab="analise">Em Análise</button></div>'+card(tab==='disponiveis'?'Oportunidades disponíveis':'Recursos em análise',tab==='disponiveis'?'Programas e oportunidades identificados pelas plataformas, ainda não avaliados. Um programa pode permanecer disponível mesmo após gerar propostas.':'Acompanhamento de elegibilidade, interesse municipal, pendências e decisão de prosseguimento.')+list(dados.filter(x=>x.status===1));return}
if(view==='cadastro'){app.innerHTML='<h1>Status 2 — Em Cadastramento</h1><p class="sub">Acompanhamento de propostas e demandas em elaboração</p>'+card('Fila de cadastramento','Propostas federais e demandas estaduais são acompanhadas com seus identificadores oficiais. A ficha do recurso permanece padronizada.')+list(dados.filter(x=>x.status===2));return}
if(view==='formalizacao'){app.innerHTML='<h1>Status 3 — Em Formalização</h1><p class="sub">Acompanhamento da formalização dos instrumentos</p>'+list(dados.filter(x=>x.status===3));return}
if(view==='execucao'){app.innerHTML='<h1>Execução</h1><p class="sub">Recursos nas etapas de execução administrativa e execução</p>'+list(dados.filter(x=>x.status===5||x.status===6));return}
}
function filter(){let q=document.getElementById('q').value.toLowerCase(),p=document.getElementById('pl').value,t=document.getElementById('tipo').value,s=document.getElementById('st').value;document.getElementById('results').innerHTML=list(dados.filter(x=>(!q||[x.id,x.nome,x.orgao,x.autor,x.registro].join(' ').toLowerCase().includes(q))&&(!p||x.plataforma===p)&&(!t||x.tipo===t)&&(!s||x.status===Number(s))))}
function navigate(v){view=v;render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-view]');if(nav){navigate(nav.dataset.view);return}let op=e.target.closest('[data-open]');if(op){selected=dados.find(x=>x.id===op.dataset.open);navigate('detalhe');return}let tb=e.target.closest('[data-tab]');if(tb){tab=tb.dataset.tab;render()}});
render();
</script></body></html>
